# e2e config for the `local` environment (docs/DESIGN.md §11.1).
# Every key is overridable by a -D system property or an environment variable
# (UPPER_SNAKE_CASE, e.g. base.url -> BASE_URL, ui.browser.headless -> UI_BROWSER_HEADLESS).

# Service entry points (docker-compose / local run). The backend is multiple services on
# different ports, so each service object reads its own base URL (overridden at runtime by the
# self-booting e2e stack, or pointed at a docker-compose stack).
base.url=http://localhost:8080
order.base.url=http://localhost:8080
market-data.base.url=http://localhost:8081
portfolio.base.url=http://localhost:8083
auth.base.url=http://localhost:8082
ws.base.url=http://localhost:8084/ws

# Demo credentials
auth.username=demo
auth.password=demo

# UI (Playwright) — see docs/DESIGN.md §7.4
ui.base.url=http://localhost:8088
ui.browser=chromium
ui.browser.headless=true
ui.browser.mode=local
ui.browser.channel=
ui.viewport.width=1920
ui.viewport.height=1080
ui.video=retain-on-failure
ui.video.width=1920
ui.video.height=1080
ui.trace=retain-on-failure
ui.screenshot.on.failure=true
ui.playwright.default-timeout=10s
ui.playwright.navigation-timeout=10s
ui.stub.hung-response-delay=5s
ui.testcontainers.startup-timeout=30s

# Shared e2e waits
e2e.await.timeout=10s
e2e.await.short-timeout=8s
e2e.await.stability-timeout=3s
e2e.await.stability-poll-delay=1s
e2e.ws.frame-timeout=10s
e2e.ws.frame.short-timeout=8s

# Optional fixed UTC instant used by the market-hours gate. Set via -Dapp.clock.fixed-instant or
# APP_CLOCK_FIXED_INSTANT and pass the same value into docker compose to make market-hours-gated
# runs deterministic on demand.
app.clock.fixed-instant=
