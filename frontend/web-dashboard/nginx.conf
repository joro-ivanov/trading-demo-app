server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend hostnames through Docker's embedded DNS at request time (cached 10 s) instead of
    # once at startup. Without this nginx keeps the IPs it saw when it started, so recreating any backend
    # container breaks the dashboard with 502s until nginx itself is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # proxy_pass with a variable is what makes nginx use the resolver. It also stops nginx from mapping
    # the matched location prefix onto a URI, so each /api location strips "/api" explicitly
    # (/api/auth/login?x -> /auth/login?x, the same mapping as before).
    set $auth_service         http://auth-service:8082;
    set $order_service        http://order-service:8080;
    set $portfolio_service    http://portfolio-service:8083;
    set $market_data_service  http://market-data-service:8081;
    set $notification_service http://notification-service:8084;

    # Reverse-proxy each API path to its backend service (single origin, no CORS).
    location /api/auth {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $auth_service;
    }
    location /api/orders {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $order_service;
    }
    location /api/portfolio {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $portfolio_service;
    }
    location /api/funds {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $portfolio_service;
    }
    location /api/prices {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $market_data_service;
    }

    # STOMP/SockJS WebSocket gateway (the URI is passed through unchanged: /ws/... -> /ws/...).
    location /ws {
        proxy_pass $notification_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
