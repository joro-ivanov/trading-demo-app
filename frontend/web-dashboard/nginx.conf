server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy each API path to its backend service (single origin, no CORS).
    location /api/auth {
        proxy_pass http://auth-service:8082/auth;
    }
    location /api/orders {
        proxy_pass http://order-service:8080/orders;
    }
    location /api/portfolio {
        proxy_pass http://portfolio-service:8083/portfolio;
    }
    location /api/funds {
        proxy_pass http://portfolio-service:8083/funds;
    }
    location /api/prices {
        proxy_pass http://market-data-service:8081/prices;
    }

    # STOMP/SockJS WebSocket gateway.
    location /ws {
        proxy_pass http://notification-service:8084/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
