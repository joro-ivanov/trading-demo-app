# Full-stack run of the trading dashboard (docs/DESIGN.md §12).
# Build the service jars first:  mvn -DskipTests package
# Then:                          docker compose up --build
# Open the dashboard at:         http://localhost:8088
#
# This stack is also the prerequisite for the e2e tests (they never boot the app):
#   docker compose up -d
#   mvn -pl e2e-tests verify -Papi-e2e      # API + WS e2e against this stack
#   mvn -pl e2e-tests verify -Pui-e2e       # Playwright UI e2e against this stack
#
# market-data runs in demo-feed mode (synthetic prices) since there is no real exchange here;
# the WireMock 'exchange' only handles REST order routing.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # Check over TCP (-h 127.0.0.1), not the Unix socket. During first-boot init the entrypoint runs
      # a temporary socket-only server to apply init.sql, which a socket pg_isready would report
      # "healthy" — before the real TCP listener is up. Dependents connecting to :5432 then hit
      # "connection refused". TCP only accepts once init has finished and the real server is listening.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  exchange:
    image: wiremock/wiremock:3.13.1
    command: ["--port", "8080"]
    volumes:
      - ./infra/wiremock/mappings:/home/wiremock/mappings:ro

  auth-service:
    build: ./services/auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    environment:
      APP_CLOCK_FIXED_INSTANT: ${APP_CLOCK_FIXED_INSTANT:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EXCHANGE_BASE_URL: http://exchange:8080
      # portfolio-service for the pre-trade short-sell guard (SELL) + funds guard (BUY)
      PORTFOLIO_BASE_URL: http://portfolio-service:8083
      # market-data-service for the latest price used to value a BUY (funds guard)
      MARKET_DATA_BASE_URL: http://market-data-service:8081
      # Working-hours gate. Defaults ON (real session, matches the e2e @RunDuringMarketHours gate).
      # Override for any-time verification:  TRADING_MARKET_HOURS_ENABLED=false docker compose up
      TRADING_MARKET_HOURS_ENABLED: ${TRADING_MARKET_HOURS_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      exchange:
        condition: service_started

  market-data-service:
    build: ./services/market-data-service
    environment:
      APP_CLOCK_FIXED_INSTANT: ${APP_CLOCK_FIXED_INSTANT:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MARKET_DATA_FEED_MODE: demo
      MARKET_DATA_SYMBOLS: AAPL,MSFT,GOOG
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  portfolio-service:
    build: ./services/portfolio-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/portfoliodb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy

  web-dashboard:
    build: ./frontend/web-dashboard
    ports:
      - "8088:80"
    depends_on:
      - auth-service
      - order-service
      - market-data-service
      - portfolio-service
      - notification-service
